name: Noxy verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Automated profile (device and independent review remain separate)
        type: choice
        options: [foundation, prototype, milestone, release]
        default: prototype

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Select checks
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          REQUESTED: ${{ inputs.profile }}
        shell: bash
        run: |
          profile=foundation
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            profile="$REQUESTED"
          elif [[ -f package.json ]]; then
            profile=prototype
            if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
              if git diff --name-only "$BASE_SHA" HEAD | node tools/docs-only.mjs; then
                profile=foundation
              fi
            fi
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
      - name: Setup dependencies
        if: steps.scope.outputs.profile != 'foundation'
        run: node tools/setup.mjs --browser-with-deps
      - name: Run selected checks
        env:
          PROFILE: ${{ steps.scope.outputs.profile }}
        run: node tools/verify.mjs "$PROFILE"
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
